<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title id="page-title">cursAR - Acceso</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link href="./styles/styles.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="icon" type="images" href="./img/Designer.png" />
  </head>

  <body>
    <!-- NAVBAR -->
    <header class="site-header">
      <div id="navbar-container"></div>
    </header>

    <main class="container my-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5">
          
          <div class="filtros_cursos p-4 p-md-5 rounded-4 shadow-lg border border-secondary border-opacity-25">
            
            <div class="text-center mb-4">
              <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3 shadow-sm" style="width: 70px; height: 70px; background-color: rgba(126, 231, 216, 0.12); border: 2px solid #7ee7d8;">
                <i class="bi bi-shield-lock-fill fs-2" style="color: #7ee7d8;"></i>
              </div>
              <h1 class="h4 fw-bold text-white mb-1" id="titulo-modo">Iniciar Sesión</h1>
              <p class="texto-secundario-claro small mb-0" id="subtitulo-modo">Accede a tu campus virtual de cursAR</p>
            </div>

            <!-- Pestañas de Navegación (Login / Registro) -->
            <div class="nav nav-pills nav-fill mb-4 p-1 rounded-3 bg-dark border border-secondary border-opacity-25" role="tablist">
              <button class="nav-link active py-2 fw-semibold small text-white" id="tab-login" type="button">Iniciar Sesión</button>
              <button class="nav-link py-2 fw-semibold small text-muted" id="tab-registro" type="button">Crear Cuenta</button>
            </div>

            <form id="formAuth" novalidate>
              
              <!-- Campo Nombre (Solo visible en Registro) -->
              <div class="mb-3 d-none" id="grupo-nombre">
                <label for="authNombre" class="form-label small texto-secundario-claro fw-semibold">Nombre y Apellido</label>
                <input type="text" class="form-control text-white rounded-3 py-2" id="authNombre" placeholder="Alan Leonel Ibañez" />
              </div>

              <div class="mb-3">
                <label for="authEmail" class="form-label small texto-secundario-claro fw-semibold">Correo Electrónico</label>
                <input type="email" class="form-control text-white rounded-3 py-2" id="authEmail" placeholder="alumno@ejemplo.com" required />
              </div>

              <div class="mb-4">
                <label for="authPassword" class="form-label small texto-secundario-claro fw-semibold">Contraseña</label>
                <div class="input-group">
                  <input type="password" class="form-control text-white rounded-start-3 py-2 border-end-0" id="authPassword" placeholder="••••••••" required />
                  <button class="btn btn-outline-secondary border-start-0 text-muted rounded-end-3 px-3" type="button" id="togglePassword">
                    <i class="bi bi-eye" id="iconoOjo"></i>
                  </button>
                </div>
                <div class="form-text text-muted" style="font-size: 0.75rem;" id="ayuda-password">Mínimo 6 caracteres.</div>
              </div>

              <button type="submit" class="btn btn-success-tech fw-bold w-100 py-3 rounded-3 text-dark fs-6 mb-3" id="btn-submit">
                Iniciar Sesión <i class="bi bi-arrow-right ms-1"></i>
              </button>
            </form>

          </div>

        </div>
      </div>
    </main>

    <!-- FOOTER -->
    <footer class="site-footer mt-5 pt-5 pb-4">
      <div id="footer-container"></div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script type="module" src="./js/navbar.js"></script>
    <script type="module" src="./js/footer.js"></script>
    <script type="module" src="./js/iaFlotante.js"></script>
    <script type="module" src="./js/logueo.js"></script>
  </body>
</html>
