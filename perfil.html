<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cursAR - Mi Perfil</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link href="./styles/styles.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="icon" type="images" href="./img/Designer.png" />
  </head>

  <body>
    <!-- NAVBAR -->
    <header class="site-header">
      <div id="navbar-container"></div>
    </header>

    <main class="container my-5">
      
      <!-- TARJETA DE INFORMACIÓN DEL USUARIO -->
      <div class="filtros_cursos p-4 p-md-5 rounded-4 shadow-sm mb-5 border border-secondary border-opacity-25">
        <div class="row align-items-center">
          <div class="col-12 col-md-auto text-center text-md-start mb-3 mb-md-0">
            <div class="rounded-circle d-inline-flex align-items-center justify-content-center fw-bold fs-2 shadow-sm text-dark" style="width: 90px; height: 90px; background-color: #7ee7d8;" id="perfil-iniciales">
              AL
            </div>
          </div>
          <div class="col-12 col-md text-center text-md-start">
            <h1 class="h3 fw-bold text-white mb-1" id="perfil-nombre">Cargando usuario...</h1>
            <p class="texto-secundario-claro small mb-2" id="perfil-email">correo@ejemplo.com</p>
            <span class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25 px-3 py-1">Estudiante Activo</span>
          </div>
          <div class="col-12 col-md-auto text-center text-md-end mt-3 mt-md-0">
            <button id="btnCerrarSesion" class="btn btn-outline-danger btn-sm px-3 py-2 rounded-3">
              <i class="bi bi-box-arrow-right me-1"></i> Cerrar Sesión
            </button>
          </div>
        </div>
      </div>

      <!-- TÍTULO DE CURSOS ADQUIRIDOS -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h5 fw-bold text-white mb-0"><i class="bi bi-journal-code me-2" style="color: #7ee7d8;"></i> Mis Cursos Adquiridos</h2>
        <a href="cursos.html" class="btn btn-success-tech btn-sm fw-bold px-3 py-2 text-dark">
          <i class="bi bi-plus-lg me-1"></i> Explorar Más Cursos
        </a>
      </div>

      <!-- GRILLA DINÁMICA DE CURSOS COMPRADOS -->
      <div class="row g-4" id="contenedor-mis-cursos">
        <!-- Inyectado dinámicamente por JavaScript -->
      </div>

    </main>

    <!-- FOOTER -->
    <footer class="site-footer mt-5 pt-5 pb-4">
      <div id="footer-container"></div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script type="module" src="./js/navbar.js"></script>
    <script type="module" src="./js/footer.js"></script>
    <script type="module" src="./js/iaFlotante.js"></script>
    <script type="module" src="./js/perfil.js"></script>
  </body>
</html>
